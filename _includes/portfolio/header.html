<header id="top" class="site-header"><a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}<span aria-hidden="true"> ✳</span></a><nav aria-label="Main navigation">
{% for link in site.data.navigation.main %}<a href="{{ link.url | relative_url }}"{% if page.url == link.url or page.collection == 'publications' and link.url == '/publications/' %} aria-current="page"{% endif %}>{{ link.title }}</a>{% endfor %}
<a class="contact-link" href="mailto:{{ site.author.email }}">{% include portfolio/icon.html name="email" class="link-icon" %}Contact ↗</a></nav></header>
