<header id="top" class="site-header"><a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}<span aria-hidden="true"> <svg class="symbol-svg symbol-star" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M16 3v26M3 16h26M7 7l18 18M7 25 25 7"/></svg></span></a><nav aria-label="Main navigation">
{% for link in site.data.navigation.main %}<a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% elsif link.url == '/lab/' and page.url contains '/lab/' %} aria-current="page"{% elsif page.collection == 'publications' and link.url == '/publications/' %} aria-current="page"{% endif %}>{{ link.title }}</a>{% endfor %}
<a class="contact-link" href="mailto:{{ site.author.email }}">{% include portfolio/icon.html name="email" class="link-icon" %}Contact <svg class="symbol-svg symbol-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12"/></svg></a></nav></header>
