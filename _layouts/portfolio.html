<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" class="no-js">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
{% include head/custom.html %}
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>document.documentElement.classList.replace('no-js','js');</script>
{% include analytics.html %}
</head><body class="{{ page.body_class }}"><a class="skip-link" href="#main-content">Skip to content</a><div class="wrap">
{% include portfolio/header.html %}<main id="main-content">{{ content }}</main>{% include portfolio/footer.html %}
</div>{% for script in page.scripts %}<script src="{{ '/assets/js/' | append: script | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endfor %}
{% include comments-providers/scripts.html %}
</body></html>
